<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app draw behind iOS notches when installed -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />

    <title>MAC Multimedia Exams</title>
    <meta
      name="description"
      content="Take and manage online exams — join with an access code, sit timed tests, and track your results."
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="application-name" content="MAC Exams" />

    <!-- iOS home-screen support (Safari ignores most of the manifest) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MAC Exams" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        /* Avoid the iOS tap-highlight flash on buttons in standalone mode */
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Shown until the JS bundle boots, so an install/launch never looks blank */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #4f46e5;
        z-index: 9999;
        transition: opacity 0.25s ease-out;
      }
      #boot-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash img {
        width: 96px;
        height: 96px;
      }
      #boot-splash .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .spinner {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="boot-splash">
      <img src="/icons/icon-192.png" alt="" />
      <div class="spinner"></div>
    </div>

    <div id="root"></div>

    <script>
      // Remove the splash once React has painted into #root.
      (function () {
        var splash = document.getElementById('boot-splash');
        var root = document.getElementById('root');
        if (!splash || !root) return;

        function dismiss() {
          splash.classList.add('hide');
          setTimeout(function () {
            splash.remove();
          }, 300);
        }

        var observer = new MutationObserver(function () {
          if (root.childNodes.length > 0) {
            observer.disconnect();
            dismiss();
          }
        });
        observer.observe(root, { childList: true });

        // Safety net: never let the splash trap the user.
        setTimeout(function () {
          observer.disconnect();
          dismiss();
        }, 10000);
      })();

      // Register the service worker for offline support and installability.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js').catch(function (err) {
            console.warn('Service worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
